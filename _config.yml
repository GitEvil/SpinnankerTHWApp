# GitHub-Pages-Konfiguration.
# Diese Dateien/Ordner werden NICHT auf der veröffentlichten Seite ausgeliefert
# (nur Entwicklungs-/Hilfsdateien, die die App im Web nicht braucht).
exclude:
  - tests
  - scripts
  - node_modules
  - package.json
  - package-lock.json
  - README.md
  - DISTRIBUTION.md
  - LICENSE
